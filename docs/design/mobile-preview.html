<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Проверка мобильной ширины</title>
  <style>
    /* Обёртка нужна только для съёмки: headless Chrome не даёт окно
       уже 500 px, а iframe задаёт документу честные 390 px, и медиа-
       запросы внутри срабатывают как на телефоне. */
    html, body { margin: 0; background: #e2e8f0; }
    iframe { display: block; width: 390px; height: 2200px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <iframe src="executive-demo.html"></iframe>
</body>
</html>
